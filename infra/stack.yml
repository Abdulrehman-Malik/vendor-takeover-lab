# The whole lab system as ONE Docker Swarm stack. This file in Git is "the truth".
#
#   Deploy / redeploy:  bash scripts/deploy.sh     (runs: docker stack deploy -c infra/stack.yml lab)
#   Image tags:         infra/versions.env          (updated by scripts/ci.sh)
#   Secrets:            infra/.env                  (generated by scripts/bootstrap.sh, NOT in Git)
#
# Every service joins the external overlay network "labnet", so they find each other by
# service name (http://orders-api:8080, sqlserver,1433, redis:6379 ...).
# Traefik reads the "traefik.*" labels and routes http://<host>:8000/<path> to the right service.

services:

  # ───────────────────────────── Front door ─────────────────────────────
  traefik:
    image: traefik:v3.5
    command:
      - --providers.swarm=true
      - --providers.swarm.exposedByDefault=false
      - --providers.swarm.network=labnet
      - --entrypoints.web.address=:80
      - --api.dashboard=true
      - --api.insecure=true            # lab only: dashboard on :8088 without a password
      - --accesslog=true
    ports:
      - "8000:80"                      # all application traffic
      - "8088:8080"                    # Traefik dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [labnet]
    deploy:
      placement:
        constraints: [node.role == manager]

  # ───────────────────────────── Data tier ──────────────────────────────
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    hostname: sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_AGENT_ENABLED: "true"      # SQL Agent jobs (db/agent-jobs)
      MSSQL_MEMORY_LIMIT_MB: "2048"
    env_file: .env                     # MSSQL_SA_PASSWORD
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    networks: [labnet]
    deploy:
      placement:
        constraints: [node.role == manager]   # keep the data volume on one node

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]   # pure cache, nothing on disk
    ports:
      - "6379:6379"
    networks: [labnet]

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    networks: [labnet]
    deploy:
      placement:
        constraints: [node.role == manager]

  minio:
    image: minio/minio
    command: ["server", "/data", "--console-address", ":9001"]
    env_file: .env                     # MINIO_ROOT_USER / MINIO_ROOT_PASSWORD
    ports:
      - "9000:9000"                    # S3 API
      - "9001:9001"                    # web console
    volumes:
      - miniodata:/data
    networks: [labnet]
    deploy:
      placement:
        constraints: [node.role == manager]

  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"                    # web inbox
    networks: [labnet]

  # ───────────────────────────── Backend services ───────────────────────
  orders-api:
    image: ${REGISTRY:-localhost:5000}/orders-api:${ORDERS_TAG:-1}
    environment:
      APP_VERSION: v${ORDERS_TAG:-1}
    env_file: .env                     # ⚠️ every secret, in plain text, for every service
    networks: [labnet]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 60s
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 5s
        order: start-first             # start the new copy before stopping the old one
        failure_action: rollback       # unhealthy new version → Swarm rolls back by itself
        monitor: 30s
      rollback_config:
        parallelism: 1
        order: start-first
      labels:
        - traefik.enable=true
        - traefik.http.routers.orders.rule=PathPrefix(`/api/orders`)
        - traefik.http.routers.orders.entrypoints=web
        - traefik.http.services.orders.loadbalancer.server.port=8080

  customers-api:
    image: ${REGISTRY:-localhost:5000}/customers-api:${CUSTOMERS_TAG:-1}
    environment:
      APP_VERSION: v${CUSTOMERS_TAG:-1}
    env_file: .env
    networks: [labnet]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 60s
    deploy:
      replicas: 1
      update_config:
        order: start-first
        failure_action: rollback
        monitor: 30s
      labels:
        - traefik.enable=true
        - traefik.http.routers.customers.rule=PathPrefix(`/api/customers`)
        - traefik.http.routers.customers.entrypoints=web
        - traefik.http.services.customers.loadbalancer.server.port=8080   # 8081 is gRPC, internal only

  billing-api:
    image: ${REGISTRY:-localhost:5000}/billing-api:${BILLING_TAG:-1}
    environment:
      APP_VERSION: v${BILLING_TAG:-1}
    env_file: .env
    networks: [labnet]
    # No healthcheck, no update_config, no rollback_config. Compare with orders-api.
    deploy:
      replicas: 1
      labels:
        - traefik.enable=true
        - traefik.http.routers.billing.rule=PathPrefix(`/api/billing`)
        - traefik.http.routers.billing.entrypoints=web
        - traefik.http.services.billing.loadbalancer.server.port=8080

  documents-api:
    image: ${REGISTRY:-localhost:5000}/documents-api:${DOCUMENTS_TAG:-1}
    environment:
      APP_VERSION: v${DOCUMENTS_TAG:-1}
    env_file: .env
    networks: [labnet]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 60s
    deploy:
      replicas: 1
      update_config:
        order: start-first
        failure_action: rollback
        monitor: 30s
      labels:
        - traefik.enable=true
        - traefik.http.routers.documents.rule=PathPrefix(`/api/documents`)
        - traefik.http.routers.documents.entrypoints=web
        - traefik.http.services.documents.loadbalancer.server.port=8080

  notification-worker:
    image: ${REGISTRY:-localhost:5000}/notification-worker:${WORKER_TAG:-1}
    env_file: .env
    networks: [labnet]
    deploy:
      replicas: 1                      # a background worker: no ports, no Traefik route

  # ───────────────────────────── Frontends ──────────────────────────────
  web-portal:
    image: ${REGISTRY:-localhost:5000}/web-portal:${PORTAL_TAG:-1}
    networks: [labnet]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
    deploy:
      replicas: 1
      update_config:
        order: start-first
        failure_action: rollback
      labels:
        - traefik.enable=true
        - traefik.http.routers.portal.rule=PathPrefix(`/`)   # shortest rule = lowest priority: catches the rest
        - traefik.http.routers.portal.entrypoints=web
        - traefik.http.services.portal.loadbalancer.server.port=80

  admin-node:
    image: ${REGISTRY:-localhost:5000}/admin-node:${ADMIN_TAG:-1}
    networks: [labnet]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    deploy:
      replicas: 1
      labels:
        - traefik.enable=true
        - traefik.http.routers.admin.rule=PathPrefix(`/admin`)
        - traefik.http.routers.admin.entrypoints=web
        - traefik.http.services.admin.loadbalancer.server.port=3000

networks:
  labnet:
    external: true                     # created once by scripts/bootstrap.sh

volumes:
  sqldata: {}
  mongodata: {}
  miniodata: {}
