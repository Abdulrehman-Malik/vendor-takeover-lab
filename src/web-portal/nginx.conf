server {
    listen 80;
    root /usr/share/nginx/html;

    # Single-page app: unknown paths fall back to index.html so Angular can handle them.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Used by the Swarm healthcheck
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "healthy";
    }
}
