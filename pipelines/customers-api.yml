# Azure DevOps pipeline for customers-api.
# In a multi-repo setup (like the vendor's 33 repos) this file would sit in the root of the
# customers-api repo. Here every service lives in one repo, so path filters make each pipeline
# run only when its own folder changes.

trigger:
  branches:
    include: [ main ]
  paths:
    include:
      - src/customers-api/*
      - src/shared-protos/*

pr:
  branches:
    include: [ main ]
  paths:
    include:
      - src/customers-api/*
      - src/shared-protos/*

variables:
  registry: localhost:5000

stages:
  - template: templates/build-and-deploy.yml
    parameters:
      service: customers-api
      dockerfile: src/customers-api/Dockerfile
      smokeTestPath: /api/customers/version
