# Azure DevOps pipeline for admin-node.
# In a multi-repo setup (like the vendor's 33 repos) this file would sit in the root of the
# admin-node repo. Here every service lives in one repo, so path filters make each pipeline
# run only when its own folder changes.

trigger:
  branches:
    include: [ main ]
  paths:
    include:
      - src/admin-node/*

pr:
  branches:
    include: [ main ]
  paths:
    include:
      - src/admin-node/*

variables:
  registry: localhost:5000

stages:
  - template: templates/build-and-deploy.yml
    parameters:
      service: admin-node
      dockerfile: src/admin-node/Dockerfile
      smokeTestPath: /admin/api/status
